<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050608">
  <title>ExWork — Оформлення документів</title>
  <meta name="description" content="ExWork — оформлення документів та консультації Україна — Польща.">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 15% 20%, rgba(0,91,255,.16), transparent 30%),
        radial-gradient(circle at 85% 25%, rgba(255,0,35,.14), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(255,205,0,.10), transparent 35%),
        #050608;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    .wrap { width: min(920px, calc(100% - 28px)); margin: 0 auto; }

    .hero {
      text-align: center;
      padding: 34px 0 18px;
    }

    .logo {
      width: min(270px, 70vw);
      aspect-ratio: 1;
      object-fit: contain;
      display: block;
      margin: 0 auto 18px;
      filter: drop-shadow(0 14px 28px rgba(0,0,0,.55));
      border-radius: 50%;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 78px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: -3px;
    }

    .ex { color: #f4f4f4; }
    .work { color: #ffd400; }

    .subtitle {
      margin: 14px 0 0;
      font-size: clamp(18px, 3.8vw, 28px);
      font-weight: 800;
      letter-spacing: 1px;
    }

    .tagline {
      margin: 10px 0 0;
      color: #bfc4cc;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .flags {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 24px auto 28px;
    }

    .flag {
      width: 150px;
      max-width: 40vw;
      padding: 11px 14px;
      border-radius: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }

    .ua {
      background: linear-gradient(#0057b7 0 50%, #ffd700 50%);
      color: #111;
    }

    .pl {
      background: linear-gradient(#fff 0 50%, #dc143c 50%);
      color: #111;
    }

    .divider { color: #777; font-weight: 900; }

    .services {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 34px;
    }

    .service {
      min-height: 110px;
      padding: 20px 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
      backdrop-filter: blur(12px);
      text-align: center;
      transition: transform .2s ease, border-color .2s ease;
    }

    .service:hover {
      transform: translateY(-4px);
      border-color: rgba(255,212,0,.55);
    }

    .icon { font-size: 28px; margin-bottom: 10px; }
    .service b { display: block; font-size: 14px; line-height: 1.25; }

    .contact-title {
      text-align: center;
      font-size: clamp(22px, 5vw, 34px);
      margin: 0 0 16px;
      font-weight: 900;
    }

    .buttons {
      display: grid;
      gap: 13px;
      max-width: 650px;
      margin: 0 auto;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 76px;
      padding: 12px 20px;
      color: #fff;
      text-decoration: none;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 12px 28px rgba(0,0,0,.35);
      transition: transform .18s ease, filter .18s ease;
    }

    .btn:hover { transform: translateY(-3px) scale(1.01); filter: brightness(1.08); }
    .btn:active { transform: scale(.985); }

    .viber { background: linear-gradient(100deg, #6d24c9, #9b4dff); }
    .telegram { background: linear-gradient(100deg, #008dcc, #18b8ff); }
    .whatsapp { background: linear-gradient(100deg, #078b4a, #25d366); }

    .btn-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 50px;
      background: rgba(255,255,255,.18);
      font-size: 25px;
      margin-right: 15px;
    }

    .btn-text { text-align: left; }
    .btn-text strong { display: block; font-size: 20px; }
    .btn-text span { display: block; margin-top: 3px; font-size: 13px; opacity: .88; }

    .arrow {
      margin-left: auto;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.18);
      font-size: 21px;
    }

    footer {
      text-align: center;
      padding: 32px 0 28px;
      color: #8d929b;
      font-size: 13px;
    }

    .accent {
      width: 90px;
      height: 4px;
      margin: 22px auto 0;
      border-radius: 99px;
      background: linear-gradient(90deg, #0057b7, #ffd700, #dc143c);
    }

    @media (max-width: 650px) {
      .wrap { width: min(100% - 20px, 560px); }
      .hero { padding-top: 22px; }
      .logo { width: min(235px, 64vw); margin-bottom: 12px; }
      h1 { letter-spacing: -2px; }
      .services { grid-template-columns: 1fr; gap: 9px; }
      .service { min-height: auto; padding: 15px; display: flex; align-items: center; text-align: left; }
      .icon { margin: 0 14px 0 0; font-size: 25px; }
      .flags { margin: 18px auto 22px; }
      .flag { width: 130px; }
      .btn { min-height: 70px; border-radius: 19px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <img class="logo" src="logo.png" alt="ExWork">
      <h1><span class="ex">Ex</span><span class="work">Work</span></h1>
      <div class="subtitle">ОФОРМЛЕННЯ ДОКУМЕНТІВ</div>
      <div class="tagline">Україна • Польща</div>

      <div class="flags" aria-label="Україна та Польща">
        <div class="flag ua">🇺🇦 УКРАЇНА</div>
        <div class="divider">×</div>
        <div class="flag pl">🇵🇱 ПОЛЬЩА</div>
      </div>
    </section>

    <section class="services">
      <div class="service"><div class="icon">📄</div><b>Підготовка документів</b></div>
      <div class="service"><div class="icon">🛂</div><b>Візи та перетин кордону</b></div>
      <div class="service"><div class="icon">💼</div><b>Працевлаштування в Польщі</b></div>
    </section>

    <section>
      <h2 class="contact-title">ЗВ'ЯЖІТЬСЯ З НАМИ</h2>

      <div class="buttons">
        <a class="btn viber" href="viber://chat?number=+380739617388" aria-label="Написати в Viber">
          <div class="btn-icon">☎</div>
          <div class="btn-text"><strong>Viber</strong><span>Написати нам</span></div>
          <div class="arrow">→</div>
        </a>

        <a class="btn telegram" href="https://t.me/DimaExwork" target="_blank" rel="noopener" aria-label="Написати в Telegram">
          <div class="btn-icon">➤</div>
          <div class="btn-text"><strong>Telegram</strong><span>Написати нам</span></div>
          <div class="arrow">→</div>
        </a>

        <a class="btn whatsapp" href="https://wa.me/+380739617388" target="_blank" rel="noopener" aria-label="Написати в WhatsApp">
          <div class="btn-icon">☎</div>
          <div class="btn-text"><strong>WhatsApp</strong><span>Написати нам</span></div>
          <div class="arrow">→</div>
        </a>
      </div>
    </section>

    <footer>
      ExWork — оформлення документів
      <div class="accent"></div>
    </footer>
  </main>
</body>
</html>
